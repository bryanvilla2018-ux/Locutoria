   name: Compilar para Windows
   on:
     workflow_dispatch: {}
     push:
       tags: ['v*']
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with: { python-version: '3.12' }
         - run: pip install -r requirements.txt pyinstaller
         - run: pyinstaller --noconfirm --clean --windowed --name LocutorIA --add-data "locutor/static;locutor/static" --collect-all webview main.py
         - name: Herramientas (ffmpeg y yt-dlp)
           shell: pwsh
           run: |
             New-Item -ItemType Directory dist/LocutorIA/herramientas | Out-Null
             Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist/LocutorIA/herramientas/yt-dlp.exe
             Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
             Expand-Archive ffmpeg.zip -DestinationPath ff
             Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/LocutorIA/herramientas/ffmpeg.exe
         - uses: actions/upload-artifact@v4
           with: { name: LocutorIA-Windows, path: dist/LocutorIA }
