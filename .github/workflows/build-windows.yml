name: Compilar para Windows
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LocutorIA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LocutorIA-Windows
          path: LocutorIA/dist/LocutorIA
